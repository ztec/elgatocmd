name: Release

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      version:
        description: Existing Git tag to build exactly
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the exact release tag
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          version="${FORGEJO_REF_NAME}"
          if [[ "${FORGEJO_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION}"
            git checkout --detach "refs/tags/${version}"
          fi
          if [[ -z "${version}" ]]; then
            echo "error: release tag is required" >&2
            exit 2
          fi
          release_sha="$(git rev-parse --verify "refs/tags/${version}^{commit}")"
          printf '%s' "${version}" >.elgatolight-release-version
          echo "version=${version}" >>"${FORGEJO_OUTPUT}"
          echo "sha=${release_sha}" >>"${FORGEJO_OUTPUT}"

      - name: Build and test every release target
        run: make release CONTAINER_ENGINE=docker VERSION_FILE=.elgatolight-release-version

      - name: Publish the Forgejo release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          # Override replaces the release, not its existing Git tag. Any annotated
          # tag message created from the release title/content remains intact.
          override: true
          prerelease: true
          hide-archive-link: true
          tag: ${{ steps.version.outputs.version }}
          sha: ${{ steps.version.outputs.sha }}
          title: elgatolight ${{ steps.version.outputs.version }}
          release-dir: dist
          release-notes: Linux elgatolight ${{ steps.version.outputs.version }} binaries and SHA-256 checksums.
